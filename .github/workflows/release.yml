name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: reekeer-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: test
        run: |
          go vet ./...
          go test ./...

      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/reekeer-agent-darwin-arm64 .

      - name: checksums
        working-directory: dist
        run: sha256sum reekeer-agent-darwin-arm64 > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/reekeer-agent-darwin-arm64
            dist/checksums.txt
          generate_release_notes: true
